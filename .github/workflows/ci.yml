name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  AD_TYPECHECK_BUDGET_MS: "250"
  AEMI_TYPECHECK_BUDGET_MS: "250"

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@7bcf4c5eb9f9dc47cd0d2916adf167c1de5c6567 # swift-ci 7bcf4c5
    permissions:
      contents: write # reusable publish permission; no archives are configured for this library

