name: CI

# A library: the shared graph builds and tests it on Linux and macOS in parallel, on a cached SwiftPM tree.
# There is no executable, so no release archives; a `v*` tag is just a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@f6da05cd0efdf60700e854efb5b6092eae89b8c5 # aemi f6da05c
    # The shared graph's `publish` job asks for contents: write; a caller must grant what a called job asks
    # for, even though the job is skipped here (no tool, so nothing to publish).
    permissions:
      contents: write
    with:
      lint-scripts: ""
      self-analysis: ""
