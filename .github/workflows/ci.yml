name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  AD_TYPECHECK_BUDGET_MS: "250"
  AEMI_TYPECHECK_BUDGET_MS: "250"

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@27f96f088df78b2a7c988356107c34e25c3d59d2 # swift-ci 27f96f0
    permissions:
      contents: write # reusable publish permission; no archives are configured for this library

