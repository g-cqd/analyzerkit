name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  AD_TYPECHECK_BUDGET_MS: "250"
  AEMI_TYPECHECK_BUDGET_MS: "250"

jobs:
  ci:
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@1da0e4043a03b3eaf5f053b8b4ecad5c1f68fae3 # swift-ci 1da0e40
    permissions:
      contents: write # reusable publish permission; no archives are configured for this library

